<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Analizador de Vendedores</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>
    <div class="app">
    <h1>Analizador de Vendedor</h1>

    <form id="form">
        <div class="campo">
            <label>¿Tiene teléfono?</label>
            <input type="checkbox" id="telefono">
        </div>

        <div class="campo">
            <label>¿Tiene web?</label>
            <input type="checkbox" id="web">
        </div>

        <div class="campo">
            <label>¿Precio muy bajo?</label>
            <input type="checkbox" id="precioMuyBajo">
        </div>

        <div class="campo">
            <label>Reportes</label>
            <input type="number" id="reportes" min="0" value="0">
        </div>

        <button type="submit">Analizar</button>
    </form>

    <div id="resultado"></div>
</div>

<script src="script.js"></script>
</body>

</html>
