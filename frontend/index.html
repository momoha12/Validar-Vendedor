<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Vendedor</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

    <div class="container">
        <h1>Analizador de Vendedor</h1>

        <form id="formulario">

            <label for="telefono">Número de teléfono</label>
            <input type="text" id="telefono" placeholder="Ej: 612345678">

            <label for="web">Página web</label>
            <input type="text" id="web" placeholder="Ej: https://empresa.com">

            <label for="precio">Precio del producto (€)</label>
            <input type="number" id="precio" placeholder="Ej: 50">

            <button type="submit">Analizar</button>
        </form>

        <div id="resultat"></div>
    </div>

    <script src="JS/script.js"></script>
</body>
</html>
